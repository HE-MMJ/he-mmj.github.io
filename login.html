<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · Dashboard MMJ 2026</title>
<link rel="icon" href="assets/img/favicon.png?v=1c12237b6f">
<link rel="stylesheet" href="assets/css/login.css?v=1c12237b6f">
</head>
<body>
<main class="lg-wrap">
  <form class="lg-card" id="fLogin" autocomplete="on" novalidate>
    <img class="lg-logo" src="assets/logo-mmj.png" alt="Musi Mitra Jaya">
    <h1 class="lg-title">Dashboard MMJ 2026</h1>
    <p class="lg-sub">Masuk untuk membuka menu tambahan</p>

    <label class="lg-field">
      <span>Nama pengguna</span>
      <input id="uUser" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="errMsg" required>
    </label>

    <label class="lg-field">
      <span>Kata sandi</span>
      <span class="lg-pw">
        <input id="uPass" name="password" type="password" autocomplete="current-password" aria-describedby="errMsg" required>
        <button id="btnSee" type="button" class="lg-see" aria-label="Lihat kata sandi" title="Lihat kata sandi">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </span>
    </label>

    <label class="lg-remember">
      <input id="uRemember" type="checkbox">
      <span>Ingat saya di perangkat ini</span>
    </label>

    <button id="btnLogin" type="submit" class="lg-btn">Masuk</button>

    <p id="errMsg" class="lg-err" role="alert" hidden>Nama pengguna atau kata sandi salah.</p>
    <p id="okNote" class="lg-note" hidden></p>
  </form>
</main>

<script src="assets/js/auth.js?v=1c12237b6f"></script>
<script>
(function () {
  "use strict";
  var f = document.getElementById("fLogin"),
      u = document.getElementById("uUser"),
      p = document.getElementById("uPass"),
      r = document.getElementById("uRemember"),
      b = document.getElementById("btnLogin"),
      e = document.getElementById("errMsg"),
      note = document.getElementById("okNote"),
      see = document.getElementById("btnSee");

  see.addEventListener("click", function () {
    var show = p.type === "password";
    p.type = show ? "text" : "password";
    see.setAttribute("aria-label", show ? "Sembunyikan kata sandi" : "Lihat kata sandi");
    see.setAttribute("title", show ? "Sembunyikan kata sandi" : "Lihat kata sandi");
  });

  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    e.hidden = true;
    note.hidden = true;

    if (!window.MMJ_AUTH) {
      e.textContent = "Halaman login gagal dimuat. Periksa koneksi lalu muat ulang.";
      e.hidden = false;
      return;
    }

    var user = window.MMJ_AUTH.login(u.value, p.value, r.checked);
    if (!user) {
      /* bedakan "kredensial salah" dari "browser memblokir penyimpanan" */
      e.textContent = (window.MMJ_AUTH.lastError === "storage")
        ? "Browser ini memblokir penyimpanan lokal, jadi login tidak bisa menyimpan sesi. Coba browser mode normal."
        : "Nama pengguna atau kata sandi salah.";
      e.hidden = false;
      f.classList.remove("lg-shake");
      void f.offsetWidth;
      f.classList.add("lg-shake");
      return;
    }

    if (r.checked && window.MMJ_AUTH.lastRemember === false) {
      note.textContent = "Browser ini tidak menyimpan data lasting, jadi sesi ini hanya berlaku untuk tab ini.";
      note.hidden = false;
    }

    b.disabled = true;
    b.textContent = "Memproses…";
    location.replace("index.html");
  });
})();
</script>
</body>
</html>
